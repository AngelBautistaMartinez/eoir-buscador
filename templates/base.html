<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ t('brand') }} — DOJ/EOIR{% endblock %}</title>
  <meta name="description" content="{% block description %}{{ t('meta_description') }}{% endblock %}">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="{{ 'en_US' if lang == 'en' else 'es_US' }}">
  <meta property="og:site_name" content="{{ t('brand') }}">
  <meta property="og:title" content="{{ self.title() }}">
  <meta property="og:description" content="{{ self.description() }}">
  <meta property="og:url" content="{{ request.url }}">
  <meta name="twitter:card" content="summary">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2323285c'%3E%3Cpath d='M12 1.5 3.5 5v6.2c0 5.9 3.7 10.4 8.5 11.8 4.8-1.4 8.5-5.9 8.5-11.8V5L12 1.5Z'/%3E%3Cpath d='m7.8 12.3 2.9 2.9 5.5-5.9-1.5-1.4-4.1 4.4-1.5-1.5-1.3 1.5Z' fill='white'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <a class="seal-badge" href="{{ url_for('index') }}" aria-hidden="true" tabindex="-1">
        <svg class="seal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
          <path d="M12 2.5 4.5 5.5v5.2c0 5 3.2 8.9 7.5 10.3 4.3-1.4 7.5-5.3 7.5-10.3V5.5L12 2.5Z" stroke-linejoin="round"/>
          <path d="m8.5 12.2 2.4 2.4 4.6-4.9" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
      <div class="heading-group">
        <a class="brand" href="{{ url_for('index') }}">{{ t('brand') }}</a>
        <p class="subtitle">{{ t('subtitle') }}</p>
      </div>
      <nav class="site-nav">
        <a class="nav-home" href="{{ url_for('index') }}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 11.5 12 4l8 7.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 10v9a1 1 0 0 0 1 1h3v-5h4v5h3a1 1 0 0 0 1-1v-9" stroke-linecap="round" stroke-linejoin="round"/></svg>
          {{ t('nav_home') }}
        </a>
        <a href="{{ url_for('consejos') }}">{{ t('nav_consejos') }}</a>
        <span class="lang-switch">
          {% if lang == 'es' %}
            <span aria-current="true">Español</span> · <a href="{{ lang_switch_url('en') }}">English</a>
          {% else %}
            <a href="{{ lang_switch_url('es') }}">Español</a> · <span aria-current="true">English</span>
          {% endif %}
        </span>
      </nav>
    </div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <p>{{ t('footer_intro') }}
       {% if data_as_of_line %}{{ data_as_of_line }}{% endif %}</p>
  </footer>
</body>
</html>
