name: Refresh EOIR data

on:
  schedule:
    # Mondays 13:00 UTC
    - cron: "0 13 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements-dev.txt

      - run: python fetch_eoir_pdfs.py

      - name: Commit and push if eoir_representatives.json changed
        run: |
          if git diff --quiet -- eoir_representatives.json; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eoir_representatives.json
          git commit -m "Refresh EOIR data ($(date -u +%Y-%m-%d))"
          git push
